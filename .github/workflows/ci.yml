name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      SEED_ADMIN_PASSWORD: ${{ secrets.TEST_SEED_ADMIN_PASSWORD }}
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
      PORT: 4000
      VITE_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm ci --prefix tests
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy   # TEST database only
        working-directory: server
      - run: npm run db:seed
        working-directory: server
      - run: npm run lint --prefix server
      - run: npm run build --prefix client
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Start API and UI
        run: |
          (cd server && npm start > ../api.log 2>&1 &)
          (cd client && npx vite --port 5173 --strictPort > ../ui.log 2>&1 &)
          npx --yes wait-on http://localhost:4000/api/health http://localhost:5173 --timeout 60000
      - run: npx playwright test --project=api
        working-directory: tests
      - run: xvfb-run -a npx playwright test --project=e2e --headed --workers=1
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
            api.log
            ui.log
          retention-days: 14
