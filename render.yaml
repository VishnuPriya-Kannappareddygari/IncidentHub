# Single Render web service: the Docker image builds the client and the API serves UI + API.
# Values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: incidenthub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL   # Neon pooled URL (production branch)
        sync: false
      - key: DIRECT_URL     # Neon direct URL (no -pooler), used by prisma migrate deploy
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY  # optional; empty = heuristic agents
        sync: false
